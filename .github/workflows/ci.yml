name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: draftsense
          POSTGRES_PASSWORD: draftsense
          POSTGRES_DB: draft_sense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U draftsense -d draft_sense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:deploy
        env: { DATABASE_URL: postgresql://draftsense:draftsense@localhost:5432/draft_sense_test }
      - run: npm run db:migrate:deploy
        env: { DATABASE_URL: postgresql://draftsense:draftsense@localhost:5432/draft_sense_test }
      - run: npm run test:integration
        env: { DATABASE_URL: postgresql://draftsense:draftsense@localhost:5432/draft_sense_test }
      - run: npm run prisma:validate --workspace=@draft-sense/data-access
        env: { DATABASE_URL: postgresql://draftsense:draftsense@localhost:5432/draft_sense_test }
